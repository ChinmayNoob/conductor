# Scrapes every Conductor process in the Compose stack. Compose's DNS returns
# one address per replica, so scaled services are found automatically.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: coordinator
    dns_sd_configs:
      - {names: [coordinator], type: A, port: 9090, refresh_interval: 10s}
  - job_name: api
    dns_sd_configs:
      - {names: [api], type: A, port: 9090, refresh_interval: 10s}
  - job_name: worker
    dns_sd_configs:
      - {names: [worker, container-worker], type: A, port: 9090, refresh_interval: 10s}
