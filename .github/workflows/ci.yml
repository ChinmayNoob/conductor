name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          args: --build-tags e2e

  test:
    name: unit + database tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      CONDUCTOR_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test -race -count=1 ./...

  e2e:
    name: end-to-end (${{ matrix.transport }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        transport: [plaintext, mtls]
    env:
      E2E_WORKERS: "3"
      # Language model tests run against the scripted mock model server.
      CONDUCTOR_LLM_BASE_URL: http://mock-llm:8090/v1
      CONDUCTOR_LLM_MODEL: mock-model
      E2E_LLM: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate certificates
        if: matrix.transport == 'mtls'
        run: |
          ./scripts/gen-dev-certs.sh
          echo "E2E_COMPOSE_FILES=docker-compose.yml,docker-compose.tls.yml" >> "$GITHUB_ENV"
          echo "COMPOSE_FILE=docker-compose.yml:docker-compose.tls.yml" >> "$GITHUB_ENV"

      # The plaintext run also turns on tracing and the observability
      # stack, so the tracing tests check whole traces in Jaeger; the mTLS
      # run covers tracing off.
      - name: Enable observability
        if: matrix.transport == 'plaintext'
        run: |
          echo "EXTRA_PROFILES=--profile observability" >> "$GITHUB_ENV"
          echo "OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317" >> "$GITHUB_ENV"
          echo "E2E_JAEGER_URL=http://localhost:16686" >> "$GITHUB_ENV"

      - name: Start the stack
        run: docker compose --profile containers --profile mock-llm $EXTRA_PROFILES up -d --build --wait --scale worker=$E2E_WORKERS

      - name: Run end-to-end tests
        run: go test -tags e2e -count=1 -v -timeout 15m ./test/e2e/

      - name: Dump logs on failure
        if: failure()
        run: docker compose --profile containers --profile mock-llm $EXTRA_PROFILES logs --no-color --timestamps

      - name: Stop the stack
        if: always()
        run: docker compose --profile containers --profile mock-llm $EXTRA_PROFILES down -v

  operator:
    name: operator (build, test, lint, generated code)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum
      - run: go build ./...
      - run: go test -race -count=1 ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          # Built with a Go new enough for the operator's module.
          version: v2.13.2
          working-directory: operator
      - name: Generated code and CRDs are current
        working-directory: .
        run: |
          make operator-generate
          git diff --exit-code -- operator deploy/helm/conductor/files/crds

  helm:
    name: helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - run: helm lint deploy/helm/conductor
      # Renders every mode and checks the chart's copies of alerts, the
      # dashboard and the CRDs.
      - run: go test -count=1 -v ./deploy/...

  e2e-kubernetes:
    name: end-to-end (kubernetes, ${{ matrix.postgres }} postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        postgres: [dev, cloudnativepg]
    env:
      E2E_PLATFORM: kubernetes
      E2E_API_URL: http://localhost:30081
      E2E_WORKERS: "3"
      E2E_LLM: mock
      POSTGRES_MODE: ${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - uses: helm/kind-action@v1
        with:
          version: v0.30.0
          cluster_name: conductor
          config: deploy/kind/cluster.yaml

      - name: Install Conductor (images, KEDA, chart)
        run: ./scripts/kind-up.sh

      - name: Run end-to-end tests
        run: |
          export E2E_API_KEY=$(./scripts/kind-up.sh --api-key)
          go test -tags e2e -count=1 -v -timeout 45m ./test/e2e/

      - name: Run helm test
        run: helm test conductor -n conductor

      - name: Dump state on failure
        if: failure()
        run: |
          kubectl get pods,deploy,scaledobjects,hpa -A -o wide
          kubectl get events -n conductor --sort-by=.lastTimestamp | tail -50
          for c in coordinator api worker operator; do
            echo "=== $c"; kubectl logs -n conductor -l app.kubernetes.io/component=$c --tail=200 --prefix --all-containers || true
          done
