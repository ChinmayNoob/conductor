# Local development stack. Secrets default to insecure development values;
# override them in .env (see .env.example) before exposing this anywhere.
#
#   docker compose up -d --build --scale worker=3
#   docker compose --profile containers up -d   # also run container tasks
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d   # with mTLS
#   docker compose --profile observability up -d  # Prometheus :9091, Grafana :3000

x-conductor: &conductor
  build: .
  image: conductor:dev
  restart: unless-stopped

# Every component: how to reach the coordinator and authenticate.
x-cluster-env: &cluster-env
  CONDUCTOR_COORDINATOR_ADDR: coordinator:8080
  CONDUCTOR_CLUSTER_TOKEN: ${CONDUCTOR_CLUSTER_TOKEN:-insecure-dev-cluster-token}
  CONDUCTOR_LOG_LEVEL: ${CONDUCTOR_LOG_LEVEL:-info}
  CONDUCTOR_LOG_FORMAT: ${CONDUCTOR_LOG_FORMAT:-text}

# Only the coordinator and API talk to Postgres; workers never see these.
x-db-env: &db-env
  <<: *cluster-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-taskscheduler}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskscheduler}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-taskscheduler}"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Two coordinators: one is elected leader, the other is a hot standby that
  # takes over within seconds if the leader dies. Callers reach either through
  # the service name and get redirected to the leader.
  coordinator:
    <<: *conductor
    command: ["coordinator"]
    environment:
      <<: *db-env
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: 2

  api:
    <<: *conductor
    command: ["api"]
    environment:
      <<: *db-env
      CONDUCTOR_API_KEY: ${CONDUCTOR_API_KEY:-insecure-dev-api-key}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      coordinator:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 2s
      timeout: 3s
      retries: 15

  worker:
    <<: *conductor
    command: ["worker"]
    environment:
      <<: *cluster-env
      CONDUCTOR_WORKER_SLOTS: ${CONDUCTOR_WORKER_SLOTS:-2}
    # Workers advertise their own container IP, so replicas never collide.
    # On shutdown they finish running tasks for up to CONDUCTOR_SHUTDOWN_TIMEOUT
    # (25s), so give them a little longer than that.
    stop_grace_period: 30s
    depends_on:
      - coordinator
    deploy:
      replicas: 2

  # Runs `type: container` tasks by talking to the host's Docker. Access to
  # the Docker socket is equivalent to root on the host, so this worker is
  # opt-in: docker compose --profile containers up -d
  container-worker:
    <<: *conductor
    command: ["worker"]
    profiles: ["containers"]
    user: root
    environment:
      <<: *cluster-env
      CONDUCTOR_WORKER_SLOTS: 2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    stop_grace_period: 30s
    depends_on:
      - coordinator

  # Observability (opt-in): every Conductor process serves /metrics on :9090.
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9091:9090"

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/conductor.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
