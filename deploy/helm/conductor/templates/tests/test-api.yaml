{{- $fullname := include "conductor.fullname" . }}
# helm test: the API answers and reaches its database.
apiVersion: v1
kind: Pod
metadata:
  name: {{ $fullname }}-test-api
  labels:
    {{- include "conductor.componentLabels" (list . "test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: health
      image: {{ include "conductor.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: [wget, -qO-, "http://{{ $fullname }}-api:{{ .Values.api.service.port }}/health"]
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
