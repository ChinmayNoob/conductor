syntax = "proto3";

package grpcapi;

option go_package = "github.com/ChinmayNoob/conductor/pkg/grpcapi";

// Every RPC requires the cluster token in the "authorization" metadata.
// Failures are returned as gRPC status errors (InvalidArgument, NotFound, ...).

enum TaskStatus {
  QUEUED = 0;
  STARTED = 1;
  COMPLETE = 2;
  FAILED = 3;
}

// Implemented by workers; called by the coordinator.
service WorkerService {
  rpc SubmitTask (TaskRequest) returns (TaskResponse) {}
  // Kills the task's process if it is running on this worker.
  rpc CancelTask (CancelTaskRequest) returns (CancelTaskResponse) {}
}

message TaskRequest {
  string task_id = 1;
  string data = 2;
  int32 timeout_seconds = 3;
  int32 retry_count = 4;      // Current retry attempt (for logging)
}

message TaskResponse {
  string task_id = 1;
  string message = 2;
  bool success = 3;           // false if the worker has no free slot
}

// Implemented by the coordinator; called by workers and the API server.
service CoordinatorService {
  rpc SubmitTask (ClientTaskRequest) returns (ClientTaskResponse) {}
  rpc CancelTask (CancelTaskRequest) returns (CancelTaskResponse) {}

  rpc SendHeartbeat (HeartbeatRequest) returns (HeartbeatResponse) {}
  rpc UpdateTaskStatus (UpdateTaskStatusRequest) returns (UpdateTaskStatusResponse) {}

  rpc SubmitWorkflow (WorkflowRequest) returns (WorkflowResponse) {}
  rpc CancelWorkflow (CancelWorkflowRequest) returns (CancelWorkflowResponse) {}
}

message ClientTaskRequest {
  string data = 1;
  int32 priority = 2;              // 1-10, lower = higher priority (default 5)
  int32 max_retries = 3;           // Max retry attempts (default 3)
  int32 retry_delay_seconds = 4;   // Base delay between retries (default 60)
  int32 timeout_seconds = 5;       // Task timeout (default 300)
  int64 scheduled_at = 6;          // Unix timestamp for delayed execution (0 = now)
}

message ClientTaskResponse {
  string task_id = 1;
}

message CancelTaskRequest {
  string task_id = 1;
}

message CancelTaskResponse {
  // False if the task had already finished (or, on a worker, isn't running there).
  bool cancelled = 1;
}

message HeartbeatRequest {
  uint32 worker_id = 1;
  string address = 2;
  // A draining worker finishes its current tasks but accepts no new ones.
  bool draining = 3;
}

message HeartbeatResponse {
  bool acknowledged = 1;
}

message UpdateTaskStatusRequest {
  string task_id = 1;
  TaskStatus status = 2;
  string output = 3;
  string error_message = 4;   // Set when status is FAILED
}

message UpdateTaskStatusResponse {
  bool should_retry = 1;      // The coordinator will retry the failed task
}

message WorkflowRequest {
  string workflow_type = 1;
  string input_json = 2;       // JSON object passed to step commands
}

message WorkflowResponse {
  string workflow_id = 1;
}

message CancelWorkflowRequest {
  string workflow_id = 1;
}

message CancelWorkflowResponse {
  // False if the workflow had already finished.
  bool cancelled = 1;
}
