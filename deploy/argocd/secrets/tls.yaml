# A private CA (self-signed, made by cert-manager) and the certificate every
# Conductor component presents to the others. Its SAN is the chart's
# tls.serverName ("conductor"); the secret holds ca.crt, tls.crt, tls.key.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: conductor-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: conductor-ca
spec:
  isCA: true
  commonName: conductor-ca
  secretName: conductor-ca
  duration: 87600h # 10 years
  privateKey: {algorithm: ECDSA, size: 256}
  issuerRef: {name: conductor-selfsigned, kind: Issuer}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: conductor-ca
spec:
  ca:
    secretName: conductor-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: conductor-tls
spec:
  secretName: conductor-tls
  duration: 8760h # a year; cert-manager renews it
  dnsNames: [conductor]
  usages: [server auth, client auth]
  privateKey: {algorithm: ECDSA, size: 256}
  issuerRef: {name: conductor-ca, kind: Issuer}
