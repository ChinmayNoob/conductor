syntax = "proto3";

package grpcapi;

option go_package = "github.com/ChinmayNoob/conductor/pkg/grpcapi";

// Every RPC requires the cluster token in the "authorization" metadata.
// Failures are returned as gRPC status errors (InvalidArgument, NotFound,
// ResourceExhausted, ...).

enum TaskStatus {
  QUEUED = 0;
  STARTED = 1;
  COMPLETE = 2;
  FAILED = 3;
}

// Implemented by workers; called by the coordinator.
service WorkerService {
  rpc SubmitTask (TaskRequest) returns (TaskResponse) {}
  // Kills the task if it is running on this worker.
  rpc CancelTask (CancelTaskRequest) returns (CancelTaskResponse) {}
  // Returns a running task's output so far, from an offset.
  rpc GetTaskOutput (TaskOutputRequest) returns (TaskOutputResponse) {}
}

message TaskRequest {
  string task_id = 1;
  string data = 2;               // shell command (type "shell")
  int32 timeout_seconds = 3;
  int32 retry_count = 4;         // current attempt, for logging
  string type = 5;               // shell, http or container
  bytes spec_json = 6;           // type-specific settings
  map<string, string> env = 7;   // extra environment variables
  int32 attempt = 8;             // dispatch number; quote it in status reports
}

message TaskResponse {
  string task_id = 1;
  string message = 2;
  bool success = 3;              // false if the worker has no free slot
}

// Implemented by the coordinator; called by workers and the API server.
service CoordinatorService {
  rpc SubmitTask (ClientTaskRequest) returns (ClientTaskResponse) {}
  rpc CancelTask (CancelTaskRequest) returns (CancelTaskResponse) {}

  rpc SendHeartbeat (HeartbeatRequest) returns (HeartbeatResponse) {}
  rpc UpdateTaskStatus (UpdateTaskStatusRequest) returns (UpdateTaskStatusResponse) {}

  rpc SubmitWorkflow (WorkflowRequest) returns (WorkflowResponse) {}
  rpc CancelWorkflow (CancelWorkflowRequest) returns (CancelWorkflowResponse) {}
  // Returns a running task's live output from the worker running it.
  rpc GetTaskOutput (TaskOutputRequest) returns (TaskOutputResponse) {}
}

message ClientTaskRequest {
  string namespace = 1;
  bytes template_json = 2;        // a task.Template, validated by the coordinator
  int64 scheduled_at = 3;         // Unix seconds; 0 = now
  string idempotency_key = 4;
}

message ClientTaskResponse {
  string task_id = 1;
  bool created = 2;              // false if the idempotency key matched an existing task
}

message CancelTaskRequest {
  string task_id = 1;
  string namespace = 2;          // required on the coordinator, ignored by workers
}

message CancelTaskResponse {
  // False if the task had already finished (or, on a worker, isn't running there).
  bool cancelled = 1;
}

message HeartbeatRequest {
  uint32 worker_id = 1;
  string address = 2;
  // A draining worker finishes its current tasks but accepts no new ones.
  bool draining = 3;
  int32 slots = 4;               // tasks it can run at once
  int32 running = 5;             // tasks it is running now
  map<string, string> labels = 6;
}

message HeartbeatResponse {
  bool acknowledged = 1;
}

message UpdateTaskStatusRequest {
  string task_id = 1;
  TaskStatus status = 2;
  string output = 3;
  string error_message = 4;            // set when status is FAILED
  map<string, string> outputs = 5;     // key=value pairs the task wrote to $CONDUCTOR_OUTPUT
  int32 attempt = 6;                   // from TaskRequest; stale attempts are ignored
  // Set when status is FAILED: wait at least this long before retrying (a
  // provider's Retry-After), or don't retry at all (retrying can't help).
  int32 retry_after_seconds = 7;
  bool permanent = 8;
  // Language model usage of this attempt (llm tasks).
  LLMUsage llm_usage = 9;
}

message LLMUsage {
  string model = 1;
  int64 input_tokens = 2;
  int64 output_tokens = 3;
  double cost_usd = 4;   // 0 when the model has no configured price
}

message UpdateTaskStatusResponse {
  bool should_retry = 1;               // the coordinator will retry the failed task
}

message WorkflowRequest {
  string namespace = 1;
  string name = 2;                     // workflow definition name
  int32 version = 3;                   // 0 = latest
  string input_json = 4;               // JSON object of inputs
  string idempotency_key = 5;
}

message WorkflowResponse {
  string workflow_id = 1;
  bool created = 2;
}

message CancelWorkflowRequest {
  string workflow_id = 1;
  string namespace = 2;
}

message CancelWorkflowResponse {
  // False if the workflow had already finished.
  bool cancelled = 1;
}

message TaskOutputRequest {
  string task_id = 1;
  int32 attempt = 2;    // the attempt to read; others report not running
  int64 offset = 3;     // position in the output stream to read from
}

message TaskOutputResponse {
  // False if the attempt isn't running (anymore): read the stored output.
  bool running = 1;
  bytes data = 2;
  int64 next_offset = 3;  // pass back as offset to continue
}
