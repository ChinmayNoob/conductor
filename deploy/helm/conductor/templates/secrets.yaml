{{- /*
Generated secrets. Each is created on install and read back on upgrades
(lookup), so tokens, keys and certificates stay the same. `helm template`
can't look anything up and prints fresh values.
*/ -}}
{{- $fullname := include "conductor.fullname" . }}

{{- if not .Values.auth.existingSecret }}
{{- $name := printf "%s-auth" $fullname }}
{{- $current := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "conductor.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  cluster-token: {{ get $current "cluster-token" | default (randAlphaNum 48 | b64enc) }}
  api-key: {{ get $current "api-key" | default (printf "cnd_%s" (randAlphaNum 48) | b64enc) }}
{{- end }}

{{- if and .Values.tls.enabled (not .Values.tls.existingSecret) }}
{{- $name := printf "%s-tls" $fullname }}
{{- $current := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $ca := genCA (printf "%s-ca" $fullname) 3650 }}
{{- $cert := genSignedCert .Values.tls.serverName nil (list .Values.tls.serverName) 3650 $ca }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "conductor.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
  ca.crt: {{ get $current "ca.crt" | default ($ca.Cert | b64enc) }}
  tls.crt: {{ get $current "tls.crt" | default ($cert.Cert | b64enc) }}
  tls.key: {{ get $current "tls.key" | default ($cert.Key | b64enc) }}
{{- end }}

{{- if eq .Values.postgres.mode "dev" }}
{{- $name := printf "%s-postgres" $fullname }}
{{- $current := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "conductor.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ get $current "password" | default (randAlphaNum 32 | b64enc) }}
{{- end }}
