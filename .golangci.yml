version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - misspell
    - unconvert
  exclusions:
    generated: strict
    rules:
      # Best-effort cleanup calls whose errors carry no useful information.
      - linters: [errcheck]
        source: '\.(Close|Rollback)\(\)'

formatters:
  enable:
    - gofmt
