# Example alerts. Queue and worker gauges come only from the leader, so
# max/sum across coordinators is the cluster's value.
groups:
  - name: conductor
    rules:
      - alert: ConductorNoLeader
        expr: max(conductor_leader) == 0 or absent(conductor_leader)
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: No coordinator is leading; nothing is being dispatched.

      - alert: ConductorNoHealthyWorkers
        expr: max(conductor_workers{state="healthy"}) == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: No healthy workers are registered.

      - alert: ConductorQueueBackingUp
        expr: max by (namespace, queue) (conductor_queue_oldest_ready_seconds) > 60
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Queue {{ $labels.namespace }}/{{ $labels.queue }}: due tasks have waited over a minute for a worker."
          description: Add workers or slots, or check the queue's concurrency and rate limits.

      - alert: ConductorFailureRateHigh
        expr: |
          sum(rate(conductor_task_results_total{result=~"failed|retried"}[5m]))
            / sum(rate(conductor_task_results_total{result!="stale"}[5m])) > 0.2
          and sum(rate(conductor_task_results_total[5m])) > 0.1
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: More than 20% of task attempts are failing.

      - alert: ConductorTasksLost
        expr: increase(conductor_tasks_lost_total[10m]) > 0
        labels: {severity: warning}
        annotations:
          summary: Running tasks were lost (a worker died or a task never reported) and were retried.
