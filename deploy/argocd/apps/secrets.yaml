# What Conductor needs before it starts: the TLS certificate between its
# components (cert-manager). The auth secret isn't in Git; see the README.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: conductor-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/ChinmayNoob/conductor.git
    targetRevision: master
    path: deploy/argocd/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: conductor
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
