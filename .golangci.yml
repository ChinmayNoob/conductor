version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - misspell
    - unconvert
  settings:
    staticcheck:
      # Defaults, minus two style-only quick fixes.
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1001", "-QF1008"]
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    generated: strict
    rules:
      # Best-effort cleanup calls whose errors carry no useful information.
      - linters: [errcheck]
        source: '\.(Close|Rollback)\(\)'
      - linters: [errcheck]
        path: _test\.go

formatters:
  enable:
    - gofmt
