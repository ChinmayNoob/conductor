{{- if .Values.operator.enabled }}
{{- $fullname := include "conductor.fullname" . }}
{{- $op := .Values.operator }}
{{- if $op.installCRDs }}
{{- /* Kept on uninstall: deleting a CRD deletes every resource of its kind. */}}
{{- range $path, $_ := .Files.Glob "files/crds/*.yaml" }}
{{- $crd := $.Files.Get $path | fromYaml }}
{{- $_ := set $crd.metadata "annotations" (merge (dict "helm.sh/resource-policy" "keep") ($crd.metadata.annotations | default dict)) }}
{{- $_ := set $crd.metadata "labels" (include "conductor.labels" $ | fromYaml) }}
---
{{ toYaml $crd }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-operator
  labels:
    {{- include "conductor.componentLabels" (list . "operator") | nindent 4 }}
---
{{- $rules := list
  (dict "apiGroups" (list "conductor.dev") "resources" (list "workflows" "workflowruns" "schedules") "verbs" (list "get" "list" "watch" "update" "patch"))
  (dict "apiGroups" (list "conductor.dev") "resources" (list "workflows/status" "workflowruns/status" "schedules/status") "verbs" (list "get" "update" "patch"))
  (dict "apiGroups" (list "conductor.dev") "resources" (list "workflowruns/finalizers" "schedules/finalizers") "verbs" (list "update"))
}}
{{- if $op.watchNamespaces }}
{{- range $ns := $op.watchNamespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-operator
  namespace: {{ $ns }}
  labels:
    {{- include "conductor.componentLabels" (list $ "operator") | nindent 4 }}
rules:
  {{- toYaml $rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-operator
  namespace: {{ $ns }}
  labels:
    {{- include "conductor.componentLabels" (list $ "operator") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-operator
    namespace: {{ $.Release.Namespace }}
---
{{- end }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-operator
  labels:
    {{- include "conductor.componentLabels" (list . "operator") | nindent 4 }}
rules:
  {{- toYaml $rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-operator
  labels:
    {{- include "conductor.componentLabels" (list . "operator") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-operator
    namespace: {{ .Release.Namespace }}
---
{{- end }}
# Leader election, so several replicas can run.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-operator-leader
  labels:
    {{- include "conductor.componentLabels" (list . "operator") | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-operator-leader
  labels:
    {{- include "conductor.componentLabels" (list . "operator") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-operator-leader
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-operator
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-operator
  labels:
    {{- include "conductor.componentLabels" (list . "operator") | nindent 4 }}
spec:
  replicas: {{ $op.replicas }}
  selector:
    matchLabels:
      {{- include "conductor.componentSelector" (list . "operator") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "conductor.componentLabels" (list . "operator") | nindent 8 }}
    spec:
      serviceAccountName: {{ $fullname }}-operator
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: operator
          image: {{ $op.image.repository }}:{{ $op.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ $op.image.pullPolicy }}
          args:
            - --leader-elect
            - --default-namespace={{ $op.defaultNamespace }}
            {{- with $op.watchNamespaces }}
            - --watch-namespaces={{ join "," . }}
            {{- end }}
          env:
            - name: CONDUCTOR_URL
              value: "http://{{ $fullname }}-api:{{ .Values.api.service.port }}"
            # The bootstrap admin key: resources may name any Conductor namespace.
            - name: CONDUCTOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "conductor.authSecret" . }}
                  key: api-key
          ports:
            - {name: metrics, containerPort: 8080}
            - {name: probes, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
            periodSeconds: 5
          resources:
            {{- toYaml $op.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-operator
  labels:
    {{- include "conductor.componentLabels" (list . "operator") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "conductor.componentSelector" (list . "operator") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports: [{port: 8080}]
      {{- with .Values.networkPolicy.metricsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
